name: Build Local Desktop Frontend

on:
  workflow_dispatch:

jobs:
  build-local-desktop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build local desktop frontend
        run: npm run build:local

      - name: Verify local desktop build
        run: |
          test -f dist/index.html
          ! grep -E "emergent\.sh|assets\.emergent\.sh|posthog|us\.i\.posthog\.com|fonts\.googleapis\.com|fonts\.gstatic\.com" dist/index.html

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmacyos-frontend-dist
          path: dist
