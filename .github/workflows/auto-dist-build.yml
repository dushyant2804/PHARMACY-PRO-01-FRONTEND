name: Auto Dist Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-dist:
    name: Build frontend dist artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          node -v
          npm -v
          rm -rf node_modules
          npm cache clean --force
          npm install --legacy-peer-deps --include=dev --no-audit --no-fund

      - name: Verify craco installed
        run: |
         ls node_modules/.bin | grep craco || true
         npm list @craco/craco

      - name: Build production dist
        run: |
          if ! npm pkg get scripts.build | grep -qv '^{}$'; then
            echo "Missing required package.json scripts.build command" >&2
            exit 1
          fi

          BUILD_PATH=dist npm run build

      - name: Verify dist folder
        run: |
          if [ ! -d dist ]; then
            echo "dist folder was not generated by the production build" >&2
            exit 1
          fi

          if [ -z "$(find dist -mindepth 1 -print -quit)" ]; then
            echo "dist folder is empty" >&2
            exit 1
          fi

      - name: Read frontend package version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload frontend dist artifact
        id: upload-frontend-dist
        uses: actions/upload-artifact@v4
        with:
          name: pharmacyos-frontend-dist
          path: dist
          if-no-files-found: error
          overwrite: true

      - name: Trigger update repo frontend release workflow
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DISPATCH_TOKEN: ${{ secrets.UPDATE_REPO_DISPATCH_TOKEN }}
          UPDATE_REPO: ${{ vars.UPDATE_REPO }}
          LATEST_VERSION: ${{ steps.package-version.outputs.version }}
          FRONTEND_ARTIFACT_URL: ${{ steps.upload-frontend-dist.outputs.artifact-url }}
          RELEASE_NOTES: ${{ github.event.head_commit.message || github.event.repository.description || '' }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Missing UPDATE_REPO_DISPATCH_TOKEN secret with repository_dispatch permission" >&2
            exit 1
          fi

          if [ -z "$UPDATE_REPO" ]; then
            echo "Missing UPDATE_REPO repository variable (expected owner/repo)" >&2
            exit 1
          fi

          if [ -z "$FRONTEND_ARTIFACT_URL" ]; then
            echo "Missing uploaded artifact URL from upload-artifact output" >&2
            exit 1
          fi

          jq -n \
            --arg event_type "frontend-release" \
            --arg latest_version "$LATEST_VERSION" \
            --arg frontend_artifact_url "$FRONTEND_ARTIFACT_URL" \
            --arg release_notes "$RELEASE_NOTES" \
            '{
              event_type: $event_type,
              client_payload: {
                latest_version: $latest_version,
                frontend_artifact_url: $frontend_artifact_url,
                artifact_url: $frontend_artifact_url,
                release_notes: $release_notes,
                whats_new: $release_notes
              }
            }' > dispatch-payload.json

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$UPDATE_REPO/dispatches" \
            --data @dispatch-payload.json
