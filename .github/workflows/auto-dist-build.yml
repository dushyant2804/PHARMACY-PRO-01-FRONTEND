name: Auto Dist Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-dist:
    name: Build frontend dist artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --legacy-peer-deps --include=dev
          else
            npm install --legacy-peer-deps --include=dev
          fi

      - name: Build production dist
        run: |
          if ! npm pkg get scripts.build | grep -qv '^{}$'; then
            echo "Missing required package.json scripts.build command" >&2
            exit 1
          fi

          BUILD_PATH=dist npm run build

      - name: Verify dist folder
        run: |
          if [ ! -d dist ]; then
            echo "dist folder was not generated by the production build" >&2
            exit 1
          fi

          if [ -z "$(find dist -mindepth 1 -print -quit)" ]; then
            echo "dist folder is empty" >&2
            exit 1
          fi

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmacyos-frontend-dist
          path: dist
          if-no-files-found: error
          overwrite: true
